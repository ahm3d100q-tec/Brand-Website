<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account — ACE</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/commerce.css"></head><body><header class="navbar simple-nav"><a class="logo" href="/index.html">ACE</a><a class="nav-icon cart-button" href="/pages/cart.html"><i class="fa-solid fa-bag-shopping"></i><span>Cart</span><b id="cartCount">0</b></a></header><main class="auth-page"><div class="auth-card"><p class="eyebrow">THE WORLD OF ACE</p><h1>Create account</h1><form data-auth-form="/api/auth/register" novalidate><label>Full name<input required name="name" minlength="2" autocomplete="name"></label><label>Email<input required name="email" type="email" autocomplete="email"></label><label>Password <small>8 characters minimum</small><input required name="password" type="password" minlength="8" autocomplete="new-password"></label><label>Confirm password<input required name="confirmPassword" type="password" minlength="8" autocomplete="new-password"></label><p id="formMessage" class="error-message" role="alert"></p><button class="primary-button" type="submit">Create account</button></form><p>Already registered? <a href="/pages/login.html">Sign in</a></p></div></main><script src="../js/store.js"></script><script src="../js/auth.js"></script></body></html>
