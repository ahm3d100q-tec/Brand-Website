<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — ACE</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/commerce.css"></head><body><header class="navbar simple-nav"><a class="logo" href="/index.html">ACE</a><a class="nav-icon" data-account href="/pages/login.html">My Account</a></header><main class="commerce-page"><p class="eyebrow">SECURE CHECKOUT</p><h1>Shipping details</h1><div class="checkout-layout"><form id="checkoutForm" class="form-card"><label>Full name<input required name="fullName" autocomplete="name"></label><label>Address<input required name="line1" autocomplete="street-address"></label><label>City<input required name="city" autocomplete="address-level2"></label><label>Country<input required name="country" autocomplete="country-name"></label><label>Phone<input required name="phone" type="tel" autocomplete="tel"></label><p id="formMessage" class="error-message" role="alert"></p><button class="primary-button" type="submit">Confirm order</button></form><aside id="checkoutSummary" class="summary-card"></aside></div></main><script src="../js/store.js"></script><script src="../js/checkout.js"></script></body></html>
